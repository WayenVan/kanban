# Personal release for this fork: push a tag like `v0.10.0-wayen.1` and this
# builds `kanban` and `kanban-mcp` for Linux (static musl) and macOS, then
# attaches them to a GitHub Release. Independent of the upstream release.yml.
name: Fork Release

on:
  push:
    tags:
      - "v*-wayen.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-apple-darwin
            os: macos-14
            zig: false
          - target: x86_64-apple-darwin
            os: macos-14
            zig: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # zig provides the musl C toolchain for the bundled SQLite.
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip3 install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmd=build
          if [ "${{ matrix.zig }}" = "true" ]; then cmd=zigbuild; fi
          cargo "$cmd" --release --locked --target "${{ matrix.target }}" \
            -p kanban-cli -p kanban-mcp

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="kanban-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kanban" \
             "target/${{ matrix.target }}/release/kanban-mcp" "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: kanban-*.tar.gz*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: dist/*
